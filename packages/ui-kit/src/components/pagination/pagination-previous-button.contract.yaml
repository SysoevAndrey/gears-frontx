# Semantic overlay for PaginationPreviousButton - part of the Pagination family,
# see pagination.contract.yaml. `mounted_in` is filled from PaginationItem's
# own accepted components, not authored here. It renders a PaginationButton
# with `square` fixed off, so it shares that part's native button, disabled
# and handler behaviour: the state-driven twin of PaginationPrevious.
component: pagination-previous-button

intent: Switch to the previous page of a paged result set through state, with a chevron and a short label.

typical_uses:
  - The previous button at the start of the page row, disabled at the first page
  - Half of a previous/next pair with no page numbers

dont_use_when:
  - situation: A button to one numbered page
    instead:
      target: PaginationButton
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_button.v1
  - situation: A button to the next page
    instead:
      target: PaginationNextButton
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_next_button.v1
  - situation: A link to the previous page, where each page has its own URL
    instead:
      target: PaginationPrevious
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_previous.v1

accepts:
  content: nothing

invariants:
  - id: fixed-content-and-accessible-name
    text: >-
      The button renders a left chevron before the label and ignores children.
      Its accessible name is the fixed `aria-label` "Go to previous page", set
      ahead of the consumer's props: `text` changes only the visible label,
      and only an `aria-label` passed to it replaces the name.
  - id: label-hidden-below-640px
    text: >-
      The visible label is hidden below a 640px viewport width
      (pagination.module.css `.previousNextText`), so a narrow viewport shows
      the chevron alone.
  - id: chevron-mirrors-in-rtl
    text: >-
      The chevron is mirrored under a right-to-left direction
      (pagination.module.css `.chevron:dir(rtl)`), so it keeps pointing
      toward the previous pages whatever the reading direction.

anti_patterns:
  - dont: Relabel the button through `text` alone
    do_instead: Pass a matching `aria-label` with a custom `text`, so the visible label stays part of the accessible name

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      pagination.test.tsx asserts getByRole('button', { name: 'Go to previous
      page' }) finds the button, with the visible "Previous" label and an svg
      inside it, and that it is disabled when asked
  rtl:
    outcome: unknown
    by: >-
      pagination.module.css mirrors the chevron with `.chevron:dir(rtl)` and
      pagination.test.tsx pins that rule, but jsdom has no layout and does
      not resolve `:dir()`, so no suite renders the button right-to-left

unexposed_parts:
  - part: the chevron icon
    reason: >-
      pagination.tsx renders a ChevronLeftIcon inside the button; it is not
      exported as a component of its own and cannot be replaced.
  - part: the visible label span
    reason: >-
      pagination.tsx renders `text` in a span with the stylesheet's
      previousNextText class; it is not exported, and `text` is the only
      control over it.

examples:
  good:
    - title: Disabled at the first page
      code: <PaginationPreviousButton disabled={page === 1} onClick={() => setPage(page - 1)} />
  bad:
    - title: A label given as children
      code: <PaginationPreviousButton>Back</PaginationPreviousButton>
      why: >-
        The button renders fixed content and ignores children; the visible
        label is set through `text`.

family_membership:
  name: pagination
  role: part
