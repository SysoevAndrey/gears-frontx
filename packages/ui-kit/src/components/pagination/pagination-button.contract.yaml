# Semantic overlay for PaginationButton - part of the Pagination family, see
# pagination.contract.yaml. `mounted_in` is filled from PaginationItem's own
# accepted components, not authored here. It is the state-driven twin of
# PaginationLink: the same item, painted by the same classes, but a native
# button, for a page change that is a state update with no URL of its own.
component: pagination-button

intent: Switch to one page of a paged result set through state, marking the page in view.

typical_uses:
  - A page number in the row of a pager driven by component state, with the current page marked by isActive

dont_use_when:
  - situation: A page that has its own URL
    instead:
      target: PaginationLink
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_link.v1
      note: >-
        A real anchor keeps the page crawlable and openable in a new tab;
        use a button only when changing the page leaves the URL alone.
  - situation: A button to the previous page
    instead:
      target: PaginationPreviousButton
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_previous_button.v1
  - situation: A button to the next page
    instead:
      target: PaginationNextButton
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.pagination_next_button.v1
  - situation: An action that is not paging
    instead:
      target: Button
      component: gts.frontx.uikit._.component.v1~frontx.uikit._.button.v1

accepts:
  content: specified
  text: true

invariants:
  - id: always-a-native-button
    text: >-
      PaginationButton always renders a `button` with `type="button"` unless
      the consumer passes another `type`, so it never submits a form by
      accident; every button attribute and handler, `onClick` and `disabled`
      included, is forwarded to it (`disabled` through Base UI's Button, see
      disabled-is-dimmed-and-inert).
  - id: is-active-marks-the-current-page
    text: >-
      `isActive` sets `aria-current="page"` and `data-active` on the button,
      and the active paint (pagination.module.css `.link[data-active]`: the
      --background fill under a --primary label) selects `data-active`;
      without it neither attribute is rendered.
  - id: square-is-a-fixed-footprint
    text: >-
      With `square` on, the button is a fixed var(--control-height-xs) square
      with no inline padding, and a label wider than that does not grow it;
      with `square` off it keeps the same height and takes inline padding of
      var(--space-2), growing with its label.
  - id: disabled-is-dimmed-and-inert
    text: >-
      A `disabled` button is dimmed to var(--opacity-disabled), takes no
      pointer events (pagination.module.css `.link:disabled` and
      `.link[data-disabled]`) and runs no click handler, in both forms. By
      default it is a natively disabled button, which a browser keeps out of
      the tab order and refuses focus to, so a button that held focus when it
      became disabled loses it to the page. With `focusableWhenDisabled`, the
      same prop Button has, it is not natively disabled: it stays in the tab
      order, can hold focus, and reports `aria-disabled="true"` instead of the
      `disabled` attribute, so the `disabled` property and a `:disabled`
      selector do not see it - check `aria-disabled` or `data-disabled`.

anti_patterns:
  - dont: Mark more than one button as isActive
    do_instead: Set isActive on the one button for the page in view; only one page is current
  - dont: Use a button for a page that has its own URL
    do_instead: Use PaginationLink with the page's real href, so the page stays crawlable and can be opened in a new tab
  - dont: Check the `disabled` property or a `:disabled` selector to tell a `focusableWhenDisabled` button is disabled
    do_instead: Read `aria-disabled` or `data-disabled`; such a button is not natively disabled

deprecations: {}

attestations:
  a11y:
    outcome: verified
    by: >-
      pagination.test.tsx asserts aria-current="page" and data-active="true"
      with isActive and neither without it, that the element is a button
      with type "button", that a disabled one matches `:disabled` and fires no
      click, and that with `focusableWhenDisabled` it takes focus, reports
      aria-disabled and carries no native `disabled`. jsdom focuses anything
      with a tabindex, which Base UI's Button always sets, so the suite cannot
      show a natively disabled button refusing focus; that rests on the
      browser's own handling of `disabled`
  rtl:
    outcome: unknown

examples:
  good:
    - title: The current page in a state-driven pager
      code: <PaginationButton isActive onClick={() => setPage(2)}>2</PaginationButton>
    - title: A page that is out of reach
      code: <PaginationButton disabled>9</PaginationButton>
    - title: A page that is out of reach but stays where a keyboard user is
      code: <PaginationButton disabled focusableWhenDisabled>9</PaginationButton>
  bad:
    - title: A button for a page that has a URL
      code: <PaginationButton onClick={() => navigate('?page=3')}>3</PaginationButton>
      why: >-
        A button is not a link: it cannot be opened in a new tab or crawled.
        When the page has its own URL, give PaginationLink that href and
        intercept the click if the app routes on the client.

family_membership:
  name: pagination
  role: part
